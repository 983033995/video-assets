name: Restore original comic PNG assets
on:
  push:
    branches:
      - feat/ni-mo-production-assets-v1
    paths:
      - 'projects/逆墨：第七位造物主/00_资产登记/上传分块/上传计划.json'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify shards and restore exact original images
        run: python3 scripts/import_nimo_assets.py
      - name: Commit reconstructed PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'projects/逆墨：第七位造物主/'
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "assets(ni-mo): restore eight original PNGs with SHA256 verification"
          git push origin "HEAD:${{ github.ref_name }}"
